name: Run Tests and Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".rubocop.yml"
      - ".ruby-version"
      - ".github/workflows/tests-and-lint.yml"
  pull_request:
    paths:
      - "**/*.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".rubocop.yml"
      - ".ruby-version"
      - ".github/workflows/tests-and-lint.yml"


jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec ruby -Itest test/all.rb

      - name: Run RuboCop
        run: bundle exec rubocop