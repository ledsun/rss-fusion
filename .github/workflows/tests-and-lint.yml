name: Run Tests and Lint

on:
  push:
    branches: [main]
  pull_request:


jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: ruby test/*_test.rb

      - name: Run RuboCop
        run: bundle exec rubocop